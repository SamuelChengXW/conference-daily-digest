# Filtering/scoring rules for the Free & Funded Opportunities digest.
# Edit this file to tune what shows up — no code changes needed.
#
# Since 2026-10-13 (user request), the digest ONLY shows opportunities that
# are free, fee-waivable, or come with funding (travel grants, scholarships,
# standalone funding programs, no-APC journal calls) — see
# tools/extract_access.py and filter_and_rank.is_eligible(). Everything
# below decides which topics are relevant and where candidates come from;
# the free/funded gate is applied on top of it.
#
# Scope: global, topic-first. We do NOT filter by location — a conference in
# any country is fair game as long as the topic is relevant. Location is kept
# in the record purely as travel-planning info.

topics:
  - name: "Renewable energy / power systems"
    weight: 1.0
    keywords:
      - renewable energy
      - solar energy
      - wind energy
      - power systems
      - power grid
      - smart grid
      - electrical power
      - power electronics
      - photovoltaic

  - name: "Energy storage / materials"
    weight: 1.0
    keywords:
      - energy storage
      - battery
      - batteries
      - electrochemistry
      - hydrogen energy
      - fuel cell
      - materials for energy
      - supercapacitor

  - name: "Energy policy / economics"
    weight: 1.0
    # "sustainability" alone was too generic in testing (matched a humanities
    # seminar on "Borders and Sustainability") — kept only as energy/environment-
    # qualified compounds.
    keywords:
      - energy policy
      - energy economics
      - energy transition
      - carbon pricing
      - climate policy
      - environmental economics
      - energy sustainability
      - environmental sustainability
      - sustainable energy
      - sustainable development
      - decarbonization
      - circular economy

  - name: "AI/ML for energy"
    weight: 1.0
    # Deliberately compound/energy-qualified — bare "machine learning" or
    # "artificial intelligence" alone match huge numbers of unrelated AI
    # conferences (confirmed noisy in testing), so every phrase here ties
    # AI/ML to an energy context.
    keywords:
      - data-driven energy
      - AI for energy
      - AI-driven energy
      - artificial intelligence for energy
      - machine learning for energy
      - machine learning energy
      - deep learning energy
      - smart energy systems
      - energy forecasting
      - load forecasting
      - energy informatics

  # Broadened 2026-08-10 per user request: energy beyond renewables,
  # engineering generally, and AI/ML generally, all at full weight (not the
  # 0.6 catch-all below) since the user wants these treated as first-class
  # topics, not an adjacent afterthought. Motivated by two real Malaysia
  # conferences (RSCE2026 - chemical engineering, MICNC2026 -
  # nanotechnology & catalysis) that fetch_um_events.py found but didn't
  # clear the filter under the old narrower scope.
  - name: "Energy (general)"
    weight: 1.0
    # Non-renewable energy — the existing "Renewable energy / power
    # systems" group above is unchanged/additive, this just covers what it
    # doesn't.
    keywords:
      - oil and gas
      - petroleum engineering
      - nuclear energy
      - thermal energy
      - combustion
      - energy conversion
      - power engineering
      - electrical engineering
      - energy engineering
      - energy systems

  - name: "Engineering (general)"
    weight: 1.0
    keywords:
      - chemical engineering
      - mechanical engineering
      - civil engineering
      - materials engineering
      - industrial engineering
      - process engineering
      - nanotechnology
      - catalysis
      - structural engineering

  - name: "AI/ML (general)"
    weight: 1.0
    # Bare AI/ML terms — deliberately NOT energy-qualified, unlike "AI/ML
    # for energy" above. Earlier testing found these noisy (match huge
    # numbers of unrelated AI conferences) — the user explicitly accepted
    # that tradeoff to get general AI/ML coverage at full weight. Same term
    # list as malaysia_ai_keywords below (that carve-out's separate
    # purpose — ungated Malaysia-tab visibility — is unaffected; this just
    # means those terms now also count toward the main list's scoring).
    keywords:
      - artificial intelligence
      - machine learning
      - deep learning
      - data science
      - neural network
      - computer vision
      - natural language processing
      - generative ai
      - large language model

  # Added 2026-10-13 per user request: economics, policy, ESG, SDGs and
  # sustainability as first-class topics.
  - name: "Economics & policy"
    weight: 1.0
    keywords:
      - economics
      - public policy
      - policy studies
      - sustainable finance
      - climate finance
      - green finance
      - finance and sustainability

  - name: "ESG"
    weight: 1.0
    keywords:
      - esg
      - environmental, social and governance
      - environmental social governance
      - sustainability reporting
      - corporate sustainability
      - corporate social responsibility
      - csr
      - impact investing
      - responsible investment

  - name: "SDGs"
    weight: 1.0
    keywords:
      - sustainable development goals
      - sdg
      - agenda 2030

  - name: "Sustainability"
    weight: 1.0
    # Bare "sustainability"/"sustainable"/"climate" were deliberately kept
    # OUT of the topic list before (bare "sustainability" matched a
    # humanities seminar on "Borders and Sustainability" in testing). The
    # user explicitly asked for sustainability coverage on 2026-10-13, so
    # they're in now at full weight, accepting that noise. The free/funded
    # gate means a false-positive match still has to be free or funded to
    # show up at all, which keeps the cost of that noise low.
    keywords:
      - sustainability
      - sustainable
      - climate
      - net zero
      - low carbon

  - name: "General environment / engineering / economics"
    weight: 0.6
    keywords:
      - environmental engineering
      - environmental science
      - climate change
      - green technology
      - sustainable engineering
      - engineering management
      - development economics
      - industrial economics

# Discovery: one WikiCFP `cat=` RSS feed per entry below, deduped by
# eventid, then relevance-filtered via the topics/keywords above.
#
# IMPORTANT — WikiCFP's separate "keyword search" RSS endpoint (`?q=...`)
# was tried here first and turned out to be broken: verified it returns the
# identical "latest 50" results regardless of query text, so it silently
# contributed nothing. `cat=` is different — confirmed it does real
# substring matching against each listing's tags for ANY string, not just
# WikiCFP's own published categories (e.g. `cat=malaysia`, `cat=energy
# security` both return correctly filtered results). So this single list is
# now the only discovery lever: add topics, sub-topics, AND regions here,
# all the same way. See tools/fetch_wikicfp.py's module docstring for the
# full investigation.
wikicfp_categories:
  # Core topics
  - energy
  - environment
  - engineering
  - economics
  - artificial intelligence
  - power
  - renewable energy
  - sustainability
  - climate change
  - electrical
  - energy storage
  - smart grid
  - energy transition
  - green energy
  - energy security
  # Energy economics/policy — extra depth per user request (2026-08).
  - energy economics
  - energy policy
  - environmental economics
  - carbon
  - electricity market
  - green finance
  - hydrogen energy
  - electric vehicle
  - solar photovoltaic
  - wind power
  # Broadened 2026-08-10 alongside the new topics groups (engineering
  # generally, energy beyond renewables, AI/ML generally) — see topics'
  # comment above for why. "engineering" and "artificial intelligence"
  # were already here; these add more specific sub-fields so WikiCFP's own
  # per-category feeds actually fetch candidates in these areas, not just
  # the scoring layer re-scoring what was already fetched.
  - chemical engineering
  - mechanical engineering
  - civil engineering
  - materials science
  - nanotechnology
  - oil and gas
  - nuclear energy
  - machine learning
  - data science
  # Economics / policy / ESG / SDGs / sustainability (2026-10-13).
  - esg
  - sdg
  - sustainable development
  - public policy
  - sustainable finance
  - corporate governance
  - corporate social responsibility
  # Malaysia / Southeast Asia / Japan — region ranking boost (region_boost
  # below) applies on top of these, but they're also just a real discovery
  # lever: a conference tagged "malaysia" won't necessarily also be tagged
  # "energy", so it needs its own feed to be found at all. Still has to
  # pass the topic-keyword prefilter to be kept — see region_boost's
  # comment on staying topic-first, not location-restricted.
  - malaysia
  - singapore
  - thailand
  - indonesia
  - vietnam
  - philippines
  - southeast asia
  - asean
  - japan
  - tokyo
  - osaka
  - kyoto

# Ranking boost (NOT a filter) for conferences located in Malaysia/Southeast
# Asia/Japan — added 2026-08 per user request (Japan added same day as the
# user's own upcoming Master's location). This deliberately does NOT let a
# location match rescue an otherwise off-topic conference: it only applies
# on top of an existing topic-keyword match (see
# classify_relevance.apply_region_boost), so the project stays global/
# topic-first as originally scoped, just with local/regional events ranked
# higher within that.
region_boost:
  enabled: true
  boost: 0.20
  regions:
    - name: "Malaysia"
      keywords:
        - malaysia
        - kuala lumpur
        - putrajaya
        - cyberjaya
        - penang
        - johor
        - selangor
        - sabah
        - sarawak
    - name: "Southeast Asia"
      keywords:
        - southeast asia
        - south east asia
        - asean
        - singapore
        - thailand
        - bangkok
        - indonesia
        - jakarta
        - vietnam
        - hanoi
        - ho chi minh
        - philippines
        - manila
        - brunei
        - cambodia
        - laos
        - myanmar
    - name: "Japan"
      keywords:
        - japan
        - tokyo
        - osaka
        - kyoto
        - yokohama
        - nagoya
        - fukuoka
        - sapporo
        - kobe
        - hokkaido
        - kyushu

# Broadened AI/CS carve-out for the DEDICATED MALAYSIA SHEET TAB ONLY (per
# user request) — general AI/ML/data-science conferences located in
# Malaysia, independent of the project's usual energy-topic scoring. Never
# affects the main email/website/Conferences tab (those stay energy-topic-
# first, as originally scoped) — see classify_relevance.apply_malaysia_ai_carveout
# and publish_sheet.py's Malaysia tab.
malaysia_ai_keywords:
  - artificial intelligence
  - machine learning
  - deep learning
  - data science
  - computer vision
  - natural language processing
  - neural network
  - big data
  - data mining
  - robotics
  - computer science
  - data analytics
  - generative ai
  - large language model

# Only keep conferences whose submission deadline falls within this many days
# from today (and is not already in the past). Widened from 120 to 180 (~6
# months) — gives more runway for a paper you'd need real prep time for,
# without going so far out that deadlines are unreliable/provisional.
deadline_window_days: 180

# Relevance score = (sum of matched topic weights) / score_denominator,
# capped at 1. A FIXED denominator (2026-10-13) instead of the sum of all
# topic weights: with the sum, every new topic group silently lowered every
# existing score — adding the ESG/SDG/economics groups would have pushed a
# single full-weight match from 0.116 to ~0.08, under the old 0.10 cutoff.
# With 3.0: one full-weight topic = 0.33, the 0.6 catch-all alone = 0.20,
# both above min_relevance_score; region_boost (0.20) still ranks meaningfully.
score_denominator: 3.0

# Minimum keyword-match score (0-1) to keep a record. Any single topic match
# clears this; zero matches (0.0) doesn't.
min_relevance_score: 0.15

# Known low-quality / "conference mill" organizers or keyword patterns to hard
# exclude regardless of topic match. Seed list — refine as real digests reveal
# more of these.
excluded_organizers: []
excluded_keywords:
  - predatory

# email.to is intentionally NOT set here (this repo is public) — the
# recipient comes only from the EMAIL_TO secret/env var. See .env.example
# and README.md's setup checklist.
email:
  subject_template: "Free & Funded Research Opportunities — {date}"

# Search source (Serper.dev search + Groq extraction) covering conferences
# WikiCFP doesn't index. Started Malaysia-only per user request, since direct
# scraping of UM/UKM/USM/UPM/UTM etc. proved unreliable (see
# workflows/daily_conference_digest.md's known-edge-cases entry), then
# broadened (2026-08-08) to also cover Japan (the user's Master's location)
# and general energy-society/journal CFPs that WikiCFP misses regardless of
# region — global/topic-first, same scope philosophy as the rest of this
# project. Broadened again (2026-08-09) with Malaysia professional-body
# sites (ieeemy.org, myiem.org.my — both verified live/accessible, unlike
# the earlier-rejected aggregators) and a curated list of known recurring
# Malaysia conference series, so a specific annual series doesn't depend on
# generic keyword search ranking to get found. Skips gracefully if
# SERPER_API_KEY/GROQ_API_KEY aren't set, same as every other optional
# integration in this project — safe to leave enabled: true even before
# those secrets exist.
#
# Cost/runtime note: each query examines up to RESULTS_PER_QUERY (3) results,
# each costing one page fetch + one Groq extraction call. Groq's free tier
# (8,000 TPM on openai/gpt-oss-20b) means a full max_queries_per_run batch
# plus llm_extract.py's fee/travel batch in the same run can trigger 429
# retries and stretch total run time — see llm_extract.py's MAX_RETRIES /
# the workflow doc's "Groq free-tier rate limit" entry. This is expected and
# self-recovers; it does not need action unless a run starts timing out.
#
# The query list below is now longer than max_queries_per_run — that's
# intentional. fetch_search_api.py's run() rotates a max_queries_per_run
# -sized window through this list by day-of-year, so the full pool
# eventually gets covered rather than the tail entries silently never
# running (a real gap in the earlier fixed-prefix behavior — see the
# workflow doc's known-edge-cases entry). Per-run Serper/Groq spend and run
# time stay about what they were at 14 queries/run regardless of how often
# the pipeline runs — but at the current weekly cadence (2026-08-19), a
# full 47-query cycle now takes about 10 weeks rather than the ~4 days it
# took daily. Slower discovery is the direct tradeoff of the reduced run
# frequency, not a bug.
search_api:
  enabled: true
  # priority_queries (2026-10-13 redesign) run EVERY run, ahead of the
  # rotating pool below — they search for free/funded opportunities
  # directly, instead of finding CFPs first and hoping some are free. The
  # rotating pool dropped 14 -> 4 per run to keep total Serper/Groq spend
  # (and run time) about where it was; dropped again 4 -> 2 when the
  # priority list grew to 17 (2026-10-13), since each query can cost up to
  # 3 Groq calls at ~4 calls/min on the free tier.
  priority_queries:
    # Conferences offering travel grants / fee waivers / free registration
    - '"student travel grant" call for papers energy conference 2027'
    - '"travel grant" call for papers sustainability conference 2027 students'
    - '"registration fee waiver" conference 2027 call for papers developing countries'
    - '"no registration fee" conference 2027 call for papers energy OR sustainability'
    - '"free registration" call for papers 2027 symposium sustainable development'
    # New topics (ESG / SDG / economics & policy) with funding
    - 'ESG conference 2027 call for papers "travel grant" OR "scholarship"'
    - 'SDG conference 2027 call for papers "fee waiver" OR "travel support"'
    - 'energy economics policy conference 2027 call for papers student scholarship'
    # Journal calls with no publication fee (APC)
    - '"no article processing charge" special issue call for papers energy policy 2027'
    - 'diamond open access journal call for papers sustainability ESG special issue 2027'
    # Fully funded / sponsored participation, worldwide. Modelled on a real
    # example the user gave (2026-10-13): the ASEAN Centre for Energy's
    # ACCEPT scholarship for AICEE (covers conference fee + air travel for
    # selected abstract authors). ACCEPT has no stable scholarship page to
    # follow (aseanenergy.org's AICEE pages 404'd on 2026-10-13), so these
    # are searched for instead.
    - 'ACCEPT scholarship AICEE ASEAN Centre for Energy call for abstracts'
    - '"scholarship" call for abstracts energy conference ASEAN OR Asia 2027 "air travel" OR "airfare"'
    - '"fully funded" conference call for papers 2027 energy OR sustainability OR climate students'
    - '"sponsored participation" OR "funded participation" call for abstracts 2027 energy policy OR sustainable development'
    # Graduate travel grants, worldwide (the user asked not to limit this to
    # Japan) plus their own university (Kyoto University, from Oct 2026).
    - 'graduate student travel grant international conference presentation 2027 application open'
    - 'Kyoto University graduate student international conference travel support 2027'
    - 'Malaysia conference 2027 call for papers "free registration" OR "no fee"'
  max_queries_per_run: 2
  queries:
    # Malaysia universities (UM/UKM/USM/UPM/UTM etc.)
    - "site:utm.my OR site:um.edu.my OR site:ukm.my OR site:usm.my OR site:upm.edu.my call for papers energy 2026"
    - "Universiti Teknologi Malaysia call for papers energy 2026"
    - "Universiti Malaya call for papers conference 2026"
    - "Universiti Kebangsaan Malaysia call for papers conference 2026"
    - "Universiti Sains Malaysia call for papers conference 2026"
    - "Universiti Putra Malaysia call for papers conference 2026"
    - "Malaysia artificial intelligence conference 2026 call for papers"
    # Malaysia professional bodies — verified live 2026-08-09 (see workflow
    # doc). ieeemy.org's conference listing alone surfaced 7 real 2026
    # Malaysia conferences on first check; myiem.org.my is broader/noisier
    # (mixes in non-academic dinners/seminars) so it leans on the same
    # conservative is_conference_cfp Groq check already used everywhere else.
    - "site:ieeemy.org conference call for papers 2026"
    - "site:myiem.org.my conference call for papers 2026"
    # Known recurring Malaysia conference series — named explicitly so a
    # specific annual series isn't at the mercy of generic search ranking.
    # Sourced from ieeemy.org's listing plus series already seen via this
    # project's own search results (InEC, ICEP).
    - "APEE 2027 call for papers"
    - "IICAIET 2027 call for papers"
    - "ISCI 2027 IEEE call for papers"
    - "IEACon 2027 call for papers"
    - "ICSIPA 2027 call for papers"
    - "ICSSA 2027 call for papers"
    - "ISTT 2027 call for papers"
    - "InEC 2027 UTM call for papers"
    - "ICEP UiTM call for papers 2027"
    # Specific real 2026 events the user found and we were missing
    # (2026-08-09) — see workflows/daily_conference_digest.md's
    # known-edge-cases entry for how each was verified live.
    - "SYNERGY 2026 UTM PROSPECT call for papers"
    - "HEIC 2026 UPM human ecology call for papers"
    - "I-GREDUC 2026 UPM call for papers"
    # Japan
    - "Japan energy conference 2026 call for papers"
    - "Japan renewable energy call for papers 2026"
    - "Japan Society of Energy and Resources call for papers 2026"
    - "Asia Pacific energy conference Japan 2026 call for papers"
    # General energy-society / journal CFPs (region-agnostic — WikiCFP often
    # misses journal special issues and society-run events specifically)
    - "energy policy journal special issue call for papers 2026"
    - "energy storage materials conference call for papers 2026"
    - "AI for energy call for papers conference 2026"
    # Malaysia energy statutory bodies + engineering professional bodies —
    # verified live 2026-08-10. seda.gov.my's INSPIRE symposium (co-run
    # with UKM) had a real abstract/paper deadline on first check; SOMChE
    # 2026 (35th Symposium of Malaysian Chemical Engineers, Sunway
    # University + IChemE Malaysia) explicitly covers AI-driven process
    # design and digital twins — engineering and AI/ML at once. See
    # workflows/daily_conference_digest.md's known-edge-cases entry.
    - "site:seda.gov.my symposium call for papers 2026"
    - "site:st.gov.my OR site:seda.gov.my energy conference 2026"
    - "SOMChE 2026 Malaysia chemical engineering call for papers"
    - "IChemE Malaysia conference call for papers 2026"
    # General (non-institution-specific) Malaysia queries reflecting the
    # broadened scope (engineering generally, energy beyond renewables,
    # AI/ML generally) — same reasoning as the topics broadening above.
    - "Malaysia chemical engineering conference call for papers 2026"
    - "Malaysia mechanical engineering conference call for papers 2026"
    - "Malaysia oil and gas conference call for papers 2026"
    - "Malaysia machine learning conference call for papers 2026"
    # More Malaysian universities — verified live 2026-08-10. Only
    # UM/UKM/USM/UPM/UTM had institution-wide coverage before this; every
    # one of these five checked turned up a real, current 2026 conference
    # on the first search (ICPEA/IConBEE at UiTM, ICME at UTHM, MECON at
    # MMU, EnCon at UNIMAS, ICAIMS at UMS). See workflows/
    # daily_conference_digest.md's known-edge-cases entry.
    - "Universiti Teknologi MARA call for papers conference 2026"
    - "Universiti Tun Hussein Onn Malaysia call for papers conference 2026"
    - "Multimedia University Malaysia call for papers conference 2026"
    - "Universiti Malaysia Sarawak call for papers conference 2026"
    - "Universiti Malaysia Sabah call for papers conference 2026"
    - "ICPEA 2027 UiTM power engineering call for papers"
    - "IConBEE 2027 UiTM call for papers"
    - "ICME 2027 UTHM mechanical engineering call for papers"
    - "MECON 2027 MMU call for papers"
    - "EnCon 2027 UNIMAS engineering call for papers"
    - "ICAIMS 2027 UMS call for papers"

# Universiti Malaya's own event management system (umevent.um.edu.my) —
# real, substantial (665 total events, 45 for 2026 alone as of 2026-08-09),
# found via a user-provided link. Needs Playwright (a headless browser) to
# read, unlike every other source here — see tools/fetch_um_events.py's
# module docstring and workflows/daily_conference_digest.md's
# known-edge-cases entry for why. Requires GROQ_API_KEY (for CFP
# confirmation) same as search_api above; skips gracefully if unset or if
# playwright isn't installed.
um_event_system:
  enabled: true

# Standalone funding programs (2026-10-13 redesign) — fetched directly every
# run by tools/fetch_funding_programs.py, so deadlines stay fresh even for
# evergreen programs. Every URL below was checked live from a script on
# 2026-10-13. MDPI's own award pages (Sustainability/Energies/Climate travel
# awards) were the obvious first choice but return 403 to scripted requests;
# Terra Viva Grants mirrors those same awards (and many more) on a public,
# robots.txt-permitted listing, so that's the route used instead.
funding_programs:
  enabled: true
  # Single program pages: checked by extract_access.py like any other
  # opportunity (fee/funding verdict + verbatim evidence quote), re-checked
  # every RECHECK_PROGRAM_DAYS since their content changes each cycle.
  # `topics` feed relevance scoring, since a program page's title alone
  # rarely contains the topic words.
  pages:
    # The user's own university (Master's from Oct 2026). Category D
    # 国際研究集会発表助成 (international conference presentation grant,
    # ~80 awards/yr, open to students with a supervisor's recommendation).
    # Page is Japanese — extract_access's link/snippet regexes include
    # Japanese terms for this. FY2026 window was 13-24 Apr 2026; the next
    # one shows up once the page is updated (re-checked every 30 days).
    - name: "Kyoto University Foundation — International Conference Presentation Grant (D 国際研究集会発表助成)"
      url: "https://www.kyodai-zaidan.or.jp/promotion/index/"
      topics: [energy systems, sustainability]
    - name: "IEEE Power Electronics Society — Student Travel Grants"
      url: "https://www.ieee-pels.org/membership/student-travel-grants/"
      topics: [power electronics, energy systems]
    - name: "IEEE PES General Meeting — Student Program (housing support)"
      # Redirects to the current year's For Students page.
      url: "https://pes-gm.org/?p=2878"
      topics: [power systems, energy systems]
  # Listing pages: each item parsed deterministically (no LLM) by
  # fetch_funding_programs.parse_terraviva_listing(). Items must carry one
  # of region_tags (eligibility) and none of exclude_tags.
  listings:
    - name: "Terra Viva Grants — travel & mobility"
      url: "https://www.terravivagrants.org/tag/travel-mobility/"
      pages: 2
      region_tags: [worldwide, asia-pacific, south-asia, southeast-asia]
      exclude_tags: [mediajournalism]

